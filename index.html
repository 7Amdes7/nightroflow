/* Spoločný systém pre "vysoké" okná: pevná hlavička + vlastný scrollovateľný obsah,
   s možnosťou potiahnutia za hlavičku nahor na celú obrazovku telefónu. */
.sheet-tall{
  display: flex!important;
  flex-direction: column!important;
  height: 60dvh!important;
  max-height: 60dvh!important;
  overflow: hidden!important;
  transition: height .32s cubic-bezier(.22,1,.36,1), max-height .32s cubic-bezier(.22,1,.36,1);
}

.sheet-tall.sheet-expanded{
  height: calc(100dvh - env(safe-area-inset-top,0px) - 8px)!important;
  max-height: calc(100dvh - env(safe-area-inset-top,0px) - 8px)!important;
}

.sheet-tall.sheet-dragging{
  transition: none!important;
}

.sheet-fixed-head{
  flex: 0 0 auto;
}

.sheet-scroll{
  flex: 1 1 auto;
  min-height: 60px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-right: 2px;
  padding-bottom: 14px;
}

.cat-list{
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding-right: 2px;
}

.cat-wrap{
  position: relative!important;
  overflow: hidden!important;
  border-radius: 14px!important;
  background: transparent!important;
  isolation: isolate!important;
  margin-bottom: 9px;
  contain: layout paint;
  box-sizing: border-box!important;
}

.cat-wrap:last-child{
  margin-bottom: 0;
}

.cat-row{
  position: relative!important;
  z-index: 2!important;
  display: grid;
  grid-template-columns: 20px 44px 1fr auto;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  background: var(--surface3);
  transform: translate3d(0,0,0);
  will-change: transform;
  touch-action: pan-y;
}

.cat-handle{
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 32px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1;
  letter-spacing: -1px;
  cursor: grab;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

.cat-wrap.cat-dragging{
  z-index: 50;
}

.cat-wrap.cat-dragging .cat-row{
  box-shadow: 0 14px 28px rgba(0,0,0,.4);
  border-color: var(--ice2);
}

.cat-row.swipe-settling{
  transition: transform .3s cubic-bezier(.22,1,.36,1)!important;
}

.cat-delete{
  position: absolute!important;
  right: 0;
  top: 0!important;
  bottom: 0!important;
  width: 68px;
  border: 0!important;
  background: linear-gradient(180deg,#ff5c5c 0%,#e8323f 55%,#c8202e 100%);
  color: #fff!important;
  font-size: 11.5px!important;
  font-weight: 850!important;
  display: flex!important;
  align-items: center!important;
  justify-content: center!important;
  text-align: center!important;
  white-space: nowrap!important;
  overflow: hidden!important;
  height: 100%!important;
  margin: 0!important;
  line-height: 1!important;
  border-radius: 14px!important;
  opacity: 0;
  visibility: hidden!important;
  transition: opacity .08s linear,visibility 0s linear .08s!important;
}

.cat-wrap.reveal-delete .cat-delete{
  opacity: 1;
  visibility: visible!important;
  transition: transform .22s cubic-bezier(.22,1,.36,1),opacity .18s ease;
}

.cat-wrap.is-removing .cat-delete{
  pointer-events: none;
  opacity: 0!important;
  visibility: hidden!important;
  transition: opacity .2s ease-out,visibility 0s linear .2s!important;
}

.cat-wrap.is-removing .cat-row{
  pointer-events: none!important;
  opacity: 0!important;
  transform: translate3d(-102%,0,0)!important;
  transition: transform .36s cubic-bezier(.16,1,.3,1),opacity .28s ease-out!important;
}

<script>
/* Use the real iOS standalone-app viewport instead of relying only on dvh,
   which can occasionally leave an unused strip at the bottom. */
(function(){
  function syncAppViewportHeight(){
    var h = window.innerHeight;
    if (window.visualViewport && window.visualViewport.height) {
      /* In standalone mode these are normally equal. Taking the larger value
         avoids shrinking the whole modal because of a transient Safari UI bug. */
      h = Math.max(h, window.visualViewport.height);
    }
    if (h > 0) {
      document.documentElement.style.setProperty('--app-viewport-height', h + 'px');
    }
  }
  syncAppViewportHeight();
  window.addEventListener('resize', syncAppViewportHeight, {passive:true});
  window.addEventListener('orientationchange', function(){setTimeout(syncAppViewportHeight, 80);}, {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncAppViewportHeight, {passive:true});
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) setTimeout(syncAppViewportHeight, 0);
  });
})();
</script>

var transactions=load(TX_KEY,[]), categories=load(CAT_KEY,defaults), currentType='expense', selectedCat=null, currentPeriod='week', customRange=null, currentAnchor=new Date(), detailType='expense', detailPeriod='week', detailCustomRange=null, detailAnchor=new Date(), customTarget='dashboard';

function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])} function endOfDay(d){var x=new Date(d);x.setHours(23,59,59,999);return x}
function rangeFor(type,custom,anchor){
 var now=anchor?new Date(anchor):new Date(),start=new Date(now),end=new Date(now);start.setHours(0,0,0,0);
 if(type==='day'){end=endOfDay(start);return[start,end]}
 if(type==='week'){
  var day=(start.getDay()+6)%7;
  start.setDate(start.getDate()-day);
  end=new Date(start);end.setDate(end.getDate()+6);end=endOfDay(end);
  return[start,end]
 }
 if(type==='month'){
  start.setDate(1);
  end=new Date(start.getFullYear(),start.getMonth()+1,0);end=endOfDay(end);
  return[start,end]
 }
 if(type==='year'){
  start=new Date(start.getFullYear(),0,1);

 }
 if(type==='custom'&&custom)return[parseISO(custom[0]),endOfDay(parseISO(custom[1]))];
 end=endOfDay(start);return[start,end]
}
function rangeText(r){var o={day:'2-digit',month:'2-digit',year:'numeric'};return r[0].toLocaleDateString('sk-SK',o)+' – '+r[1].toLocaleDateString('sk-SK',o)}
function inRange(t,r){var d=parseISO(t.date);return d>=r[0]&&d<=r[1]}
function totals(type,custom,anchor){var r=rangeFor(type,custom===undefined?customRange:custom,anchor),inc=0,exp=0;transactions.filter(t=>inRange(t,r)).forEach(t=>t.type==='income'?inc+=+t.amount:exp+=+t.amount);return{inc,exp,balance:inc-exp,range:r}}
function shiftAnchor(anchor,type,step){
 var d=new Date(anchor||new Date());d.setHours(12,0,0,0);
 if(type==='day')d.setDate(d.getDate()+step);
 else if(type==='week')d.setDate(d.getDate()+step*7);
 else if(type==='month'){var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+step);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
 else if(type==='year'){var m=d.getMonth(),day=d.getDate();d.setDate(1);d.setFullYear(d.getFullYear()+step);d.setMonth(m);d.setDate(Math.min(day,new Date(d.getFullYear(),m+1,0).getDate()))}
 return d
}
function isCurrentPeriod(anchor,type){
 var selected=rangeFor(type,null,anchor)[0].getTime();
 var current=rangeFor(type,null,new Date())[0].getTime();
 return selected>=current;
}
function shiftPeriod(which,step){

 if(type==='custom')return;

 else{currentAnchor=candidate;render()}
}

 if(type==='month')return r[0].toLocaleDateString('sk-SK',{month:'long',year:'numeric'});

 return 'Vlastné obdobie'
}
function updatePeriodNav(){var custom=currentPeriod==='custom',nav=$('periodNav');if(nav)nav.hidden=custom;if(!custom&&$('periodNavLabel'))$('periodNavLabel').textContent=periodName(currentPeriod,rangeFor(currentPeriod,null,currentAnchor));if($('periodNext'))$('periodNext').disabled=custom||isCurrentPeriod(currentAnchor,currentPeriod)}
function updateDetailPeriodNav(){var custom=detailPeriod==='custom',nav=$('detailPeriodNav');if(nav)nav.hidden=custom;if(!custom&&$('detailPeriodNavLabel'))$('detailPeriodNavLabel').textContent=periodName(detailPeriod,rangeFor(detailPeriod,null,detailAnchor));if($('detailPeriodNext'))$('detailPeriodNext').disabled=custom||isCurrentPeriod(detailAnchor,detailPeriod)}

 ['day','week','month'].forEach(p=>{$(p+'Balance').textContent=shortMoney(totals(p,null,new Date()).balance)});updatePeriodNav(); renderTransactions(x.range,null,null,4);renderCategories();}
function deleteTransaction(t,wrap){
  function commitDelete(){
    transactions=transactions.filter(function(x){return x.id!==t.id});
    save(TX_KEY,transactions);
    render();
    if($('detailOverlay').classList.contains('open')){detailType?renderDetail():renderAllDetail()}
  }
  if(!wrap){commitDelete();return}

  var rect=wrap.getBoundingClientRect();
  var h=Math.max(1,Math.ceil(rect.height));
  var styles=getComputedStyle(wrap);
  var mb=parseFloat(styles.marginBottom)||0;

  /* Najprv uzamkneme aktuálnu výšku, aby prechod z auto na 0 neskočil. */
  wrap.style.height=h+'px';
  wrap.style.minHeight='0';
  wrap.style.marginBottom=mb+'px';
  wrap.style.overflow='hidden';
  wrap.style.opacity='1';
  wrap.style.transform='translate3d(0,0,0)';

  /* Fáza 1: riadok elegantne odletí doľava a tlačidlo Vymazať sa jemne vytratí (CSS trieda). */
  requestAnimationFrame(function(){
    wrap.classList.add('is-removing');
  });

  /* Fáza 2: až keď je odchod riadku vizuálne rozbehnutý, priestor sa plynule zloží. */
  setTimeout(function(){
    requestAnimationFrame(function(){
      wrap.style.transition='height .36s cubic-bezier(.4,0,.2,1),margin-bottom .36s cubic-bezier(.4,0,.2,1),opacity .24s ease-out';
      wrap.style.height='0px';
      wrap.style.marginBottom='0px';
      wrap.style.opacity='0';
    });
  },150);

  var done=false;
  function finish(){
    if(done)return;
    done=true;
    wrap.removeEventListener('transitionend',onEnd);
    commitDelete();
  }
  function onEnd(e){if(e.target===wrap&&e.propertyName==='height')finish()}
  wrap.addEventListener('transitionend',onEnd);
  setTimeout(finish,560);
}

function renderTransactions(r,listId,onlyType,limit,catFilter){
 var list=$(listId||'txList'),arr=transactions.filter(t=>inRange(t,r)&&(!onlyType||t.type===onlyType)&&(!catFilter||(t.category||'none')===catFilter)).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),openRow=null,openOffset=0;

 if(!arr.length){list.innerHTML='<div class="empty"><div class="glyph">💸</div>V tomto období zatiaľ nič nie je.</div>';return}
 arr.forEach(t=>{
  var c=categories.find(c=>c.id===t.category)||{emoji:'•',name:'Bez kategórie'},wrap=document.createElement('div'),del=document.createElement('button'),edit=document.createElement('button'),el=document.createElement('div');
  wrap.className='tx-wrap';del.type='button';del.className='tx-delete';del.textContent='Vymazať';edit.type='button';edit.className='tx-edit';edit.textContent='Upraviť';el.className='tx';

  del.addEventListener('click',e=>{e.stopPropagation();deleteTransaction(t,wrap)});

  var max=80,sx=0,sy=0,current=0,startOffset=0,axis=null,drag=false;
  el.addEventListener('touchstart',e=>{if(openRow&&openRow!==el){openRow.classList.add('swipe-settling');openRow.style.transform='translate3d(0,0,0)';if(openRow.parentElement)openRow.parentElement.classList.remove('reveal-delete','reveal-edit');openRow=null}var q=e.touches[0];sx=q.clientX;sy=q.clientY;axis=null;drag=true;startOffset=openRow===el?openOffset:0;current=startOffset;el.classList.remove('swipe-settling')},{passive:true});
  el.addEventListener('touchmove',e=>{if(!drag)return;var q=e.touches[0],dx=q.clientX-sx,dy=q.clientY-sy;if(axis===null&&(Math.abs(dx)>5||Math.abs(dy)>5))axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(axis!=='x')return;e.preventDefault();current=Math.max(-max,Math.min(max,startOffset+dx));wrap.classList.toggle('reveal-delete',current<-2);wrap.classList.toggle('reveal-edit',current>2);el.style.transform='translate3d('+current+'px,0,0)'},{passive:false});

  wrap.append(del,edit,el);list.appendChild(wrap)

}

function renderCategorySummary(arr,type){
 var box=$('categorySummary'),list=$('categorySummaryList');
 if(!box||!list)return;

 $('categorySummaryTitle').textContent=type==='income'?'Príjmy podľa kategórií':'Výdavky podľa kategórií';

 rows.forEach(function(x){
  var pct=grand?x.total/grand*100:0,row=document.createElement('div');

    function measureOtherHeight(expandedState){
      const had=sheet.classList.contains('sheet-expanded');
      if(had!==expandedState) sheet.classList.toggle('sheet-expanded');
      const h=sheet.getBoundingClientRect().height;
      if(had!==expandedState) sheet.classList.toggle('sheet-expanded');
      return h;
    }

    function reset(animated){
      sheet.classList.remove('sheet-dragging');
      overlay.classList.remove('sheet-dragging');
      sheet.style.transition=animated?'transform .34s '+SNAP_EASE+',opacity .24s ease':'';
      sheet.style.transform='';
      sheet.style.webkitTransform='';
      overlay.style.backgroundColor='';
      if(animated) setTimeout(function(){sheet.style.transition=''},SNAP_MS);
      active=dragging=false; velocity=0;
    }

    function doClose(){
      sheet.classList.remove('sheet-dragging');
      overlay.classList.remove('sheet-dragging');
      sheet.style.transition='transform .28s cubic-bezier(.32,.08,.64,1),opacity .22s ease';
      sheet.style.transform='translate3d(0,110%,0)';
      sheet.style.webkitTransform='translate3d(0,110%,0)';
      sheet.style.opacity='.98';
      overlay.style.transition='background-color .22s ease,opacity .22s ease';
      overlay.style.backgroundColor='rgba(0,0,0,0)';
      setTimeout(function(){
        // closeAll() lives inside the main app scope; fall back to manual toggling if unavailable.
        if(window.__closeAllOverlays){window.__closeAllOverlays()}
        else{document.querySelectorAll('.overlay.open').forEach(function(item){item.classList.remove('open')});document.body.classList.remove('modal-open')}
        sheet.style.transition='';sheet.style.transform='';sheet.style.webkitTransform='';sheet.style.opacity='';
        overlay.style.transition='';overlay.style.backgroundColor='';
        if(tall)sheet.classList.remove('sheet-expanded');
        clearHeightDrag();
      },220);
      active=dragging=false;
    }

    function doCollapse(){
      // Ease from wherever the live drag left off down to the resting collapsed height, then hand off to the CSS class.
      sheet.classList.remove('sheet-dragging');
      overlay.classList.remove('sheet-dragging');
      sheet.style.transition=HEIGHT_TRANSITION+',transform .3s '+SNAP_EASE+',opacity .24s ease';
      setDragHeight(collapsedH);
      sheet.style.transform='';
      sheet.style.webkitTransform='';
      overlay.style.backgroundColor='';
      setTimeout(function(){
        sheet.classList.remove('sheet-expanded');
        sheet.style.transition='';
        clearHeightDrag();
      },SNAP_MS);
      active=dragging=false; velocity=0;
    }

    function doExpand(){
      // Commit the live drag into the full-screen state with a smooth height transition.
      sheet.classList.remove('sheet-dragging');
      overlay.classList.remove('sheet-dragging');
      sheet.style.transition=HEIGHT_TRANSITION;
      setDragHeight(expandedH);
      setTimeout(function(){
        sheet.classList.add('sheet-expanded');
        sheet.style.transition='';
        clearHeightDrag();
      },SNAP_MS);
      active=dragging=false; velocity=0;
    }

    function doShrinkBack(){
      // Didn't drag far enough — ease back to the height we started this gesture from.
      const target=wasExpanded?expandedH:collapsedH;
      sheet.classList.remove('sheet-dragging');
      overlay.classList.remove('sheet-dragging');
      sheet.style.transition=HEIGHT_TRANSITION+',transform .3s '+SNAP_EASE;
      setDragHeight(target);
      sheet.style.transform='';
      sheet.style.webkitTransform='';
      overlay.style.backgroundColor='';
      setTimeout(function(){
        sheet.style.transition='';
        clearHeightDrag();
      },SNAP_MS);
      active=dragging=false; velocity=0;
    }

    sheet.addEventListener('touchstart',function(e){
      if(!overlay.classList.contains('open') || e.touches.length!==1) return;
      const t=e.touches[0], rect=sheet.getBoundingClientRect();
      const localY=t.clientY-rect.top;
      // Only the grip/header area; for non-expanding sheets, only while content is already at its top.
      if(localY>START_ZONE) return;
      if(!tall && sheet.scrollTop>1) return;
      if(e.target.closest('button,input,select,textarea,label')) return;
      active=true; dragging=false; startY=lastY=t.clientY; startX=t.clientX; lastTime=performance.now(); velocity=0;
      wasExpanded=tall&&sheet.classList.contains('sheet-expanded');
      if(tall){
        collapsedH=wasExpanded?measureOtherHeight(false):rect.height;
        expandedH=wasExpanded?rect.height:0; // measured lazily for the expand gesture, once actually needed
      }
      heightDragActive=false; overflowActive=false;
    },{passive:true});

    sheet.addEventListener('touchmove',function(e){
      if(!active || e.touches.length!==1) return;
      const t=e.touches[0], dy=t.clientY-startY, dx=t.clientX-startX;
      if(!dragging){
        if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)){active=false;return;}
        if(Math.abs(dy)<8) return;
        if(Math.abs(dy)<=Math.abs(dx)*1.2) return;
        dragging=true;
        const willTransformDrag=!tall || (dy>0 && wasExpanded===false);
        if(willTransformDrag){
          sheet.classList.add('sheet-dragging');
          overlay.classList.add('sheet-dragging');
        }
      }
      if(tall && dy<0 && !wasExpanded){
        // Dragging the header UP: the sheet's top edge follows the finger exactly (1:1), up to full screen.
        if(!heightDragActive){
          expandedH=measureOtherHeight(true);
          sheet.classList.add('sheet-dragging');
          overlay.classList.add('sheet-dragging');
          heightDragActive=true;
        }
        e.preventDefault();
        const now=performance.now(), dt=Math.max(1,now-lastTime);
        velocity=(t.clientY-lastY)/dt; lastY=t.clientY; lastTime=now;
        const cap=Math.max(1,expandedH-collapsedH);
        const raw=-dy;
        const grown=raw<=cap?raw:cap+(raw-cap)*.3; // slight rubber-band once fully expanded
        setDragHeight(collapsedH+grown);
        return;
      }
      if(tall && dy>0 && wasExpanded){
        // Dragging the header DOWN from full screen: the sheet visibly shrinks 1:1 with the finger;
        // once it reaches its resting collapsed size, further travel slides it toward closing.
        if(!heightDragActive){
          sheet.classList.add('sheet-dragging');
          overlay.classList.add('sheet-dragging');
          heightDragActive=true;
        }
        e.preventDefault();
        const now=performance.now(), dt=Math.max(1,now-lastTime);
        velocity=(t.clientY-lastY)/dt; lastY=t.clientY; lastTime=now;
        const cap=Math.max(1,expandedH-collapsedH);
        if(dy<=cap){
          overflowActive=false;
          setDragHeight(expandedH-dy);
          sheet.style.transform=''; sheet.style.webkitTransform='';
          overlay.style.backgroundColor='';
        }else{
          overflowActive=true;
          setDragHeight(collapsedH);
          const overflow=dy-cap;
          const move=overflow<=170?overflow*(1-overflow/900):170*(1-170/900)+(overflow-170)*.42;
          sheet.style.transform='translate3d(0,'+move+'px,0)';
          sheet.style.webkitTransform='translate3d(0,'+move+'px,0)';
          const fade=Math.max(.16,.72*(1-Math.min(move/360,.78)));
          overlay.style.backgroundColor='rgba(0,0,0,'+fade+')';
        }
        return;
      }
      if(heightDragActive){
        // Direction reversed back past neutral — release the height override before falling through to the plain close-drag below.
        sheet.style.transition='';
        clearHeightDrag();
      }
      if(dy<0) return;
      e.preventDefault();
      const now=performance.now(), dt=Math.max(1,now-lastTime);
      velocity=(t.clientY-lastY)/dt; lastY=t.clientY; lastTime=now;
      // progressive resistance makes the gesture feel controlled rather than 1:1 forever
      const move=dy<=170?dy*(1-dy/900):170*(1-170/900)+(dy-170)*.42;
      sheet.style.transform='translate3d(0,'+move+'px,0)';
      sheet.style.webkitTransform='translate3d(0,'+move+'px,0)';
      const fade=Math.max(.16,.72*(1-Math.min(move/360,.78)));
      overlay.style.backgroundColor='rgba(0,0,0,'+fade+')';
    },{passive:false});

    function finish(e){
      if(!active){ return; }
      const y=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY:lastY;
      const dy=y-startY;
      if(heightDragActive && tall && !wasExpanded){
        // was dragging UP to expand
        const cap=Math.max(1,expandedH-collapsedH);
        const progress=Math.min(1,Math.max(0,(-dy)/cap));
        const commit=progress>=COMMIT_FRACTION || velocity<=-VELOCITY_LIMIT;
        if(commit){ doExpand(); } else { doShrinkBack(); }
        return;
      }
      if(heightDragActive && tall && wasExpanded){
        // was dragging DOWN to shrink, possibly past the resting size into a close-drag
        const cap=Math.max(1,expandedH-collapsedH);
        if(overflowActive){
          const overflow=Math.max(0,dy-cap);
          const shouldClose=overflow>=CLOSE_OVERFLOW || (overflow>=40 && velocity>=VELOCITY_LIMIT);
          if(shouldClose){ doClose(); } else { doCollapse(); }
        }else{
          const progress=Math.min(1,Math.max(0,dy/cap));
          const commit=progress>=COMMIT_FRACTION || velocity>=VELOCITY_LIMIT;
          if(commit){ doCollapse(); } else { doShrinkBack(); }
        }
        return;
      }
      const posDy=Math.max(0,dy);
      const shouldClose=dragging && (posDy>=CLOSE_DISTANCE || (posDy>=48 && velocity>=VELOCITY_LIMIT));
      if(shouldClose){ doClose(); }
      else if(dragging){ reset(true); }
      else{ active=false; }
    }
    sheet.addEventListener('touchend',finish,{passive:true});
    sheet.addEventListener('touchcancel',function(){
      if(heightDragActive){ doShrinkBack(); return; }
      if(dragging)reset(true);else{active=false;}
    },{passive:true});
  });
})();
</script>
</body>
</html>
